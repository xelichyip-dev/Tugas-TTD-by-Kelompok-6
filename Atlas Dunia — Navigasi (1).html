*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{margin:0;font-size:22px;line-height:1.1}.top small{display:block;color:var(--pr);font-size:10px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer;flex:none}
.sp{flex:1}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.mapw{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--bd);aspect-ratio:360/252}
.mapw svg{width:100%;height:100%;display:block;touch-action:none}
.ctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.cap{font-size:11px;color:var(--mu);margin:6px 2px}
h2{font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}h2 a{font-size:12px;color:var(--pr);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.ic{width:44px;height:44px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:22px;flex:none}
.row b{display:block;font-size:15px}.row span{color:var(--mu);font-size:12px}.row i{margin-left:auto;color:var(--pr);font-style:normal;font-size:18px}
.btn{padding:11px 14px;border-radius:12px;border:0;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer;flex:1}
.btn.sec{background:var(--pl);color:var(--pr)}.btns{display:flex;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lm{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;position:relative}
.lm div{font-size:26px}.lm button{position:absolute;top:2px;right:2px;border:0;background:none;font-size:14px;cursor:pointer;color:var(--pr)}
.sum{border:2px solid var(--pr);border-radius:16px;padding:14px;margin:12px 0}.sum big{font-size:28px;font-weight:700}
.sum small{display:block;color:var(--mu)}
.res{margin-top:6px}.res .card{padding:8px 12px;margin:4px 0}
nav{display:flex;gap:4px;padding:8px 12px 10px;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);border-radius:12px;padding:6px 0;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}nav button[aria-current=page]{background:var(--pl);color:var(--pr);font-weight:700}
.step{display:flex;gap:10px;padding:5px 0;color:var(--tx)}.empty{color:var(--mu);text-align:center;padding:30px 0}

<script>
